name: Build APK Resiliente (Janus Call)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf automake autopoint gettext libtool libltdl-dev \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev patch clang lld
          python3 -m pip install --upgrade pip setuptools wheel "cython<3.0" buildozer

      - name: Compilar APK debug com diagnóstico
        run: |
          set +e
          LOG_FILE="/tmp/buildozer.log"
          yes | buildozer android debug 2>&1 | tee "$LOG_FILE"
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" -ne 0 ]; then
            echo "================ ERRO REAL DETECTADO ================"
            grep -iE "Command failed:|error:|ModuleNotFoundError|No such file|Exception:|cffi|rust|cargo" "$LOG_FILE" | tail -n 35
            echo "====================================================="
          fi
          exit "$CODE"

      - name: Enviar APK como Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: janus-call-apk
          path: bin/*.apk
