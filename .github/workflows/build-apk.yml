name: Build APK Janus Call

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Sanitizar e validar arquivos do projeto
        run: |
          set -e
          ls -la
          test -f buildozer.spec
          test -f main.py
          python3 - <<'EOF'
          import pathlib

          exts = {".py", ".kv", ".spec", ".yml", ".yaml", ".txt", ".json", ".ini"}
          for path in sorted(pathlib.Path(".").rglob("*")):
              if not path.is_file():
                  continue
              if any(part in {".git", ".buildozer"} for part in path.parts):
                  continue
              if path.suffix.lower() not in exts:
                  continue

              raw = path.read_bytes()
              # Remove UTF-8 BOM se existir
              if raw.startswith(b"\xef\xbb\xbf"):
                  raw = raw[3:]

              # Corrige erro comum de digitação em declarações de encoding
              raw = raw.replace(b"uft-8", b"utf-8").replace(b"uft8", b"utf-8")

              try:
                  text = raw.decode("utf-8")
              except UnicodeDecodeError:
                  # Recupera arquivos salvos em Latin-1 / Windows-1252 (ex: \xf6, €)
                  text = raw.decode("cp1252", errors="replace")

              path.write_text(text, encoding="utf-8")

              if path.suffix.lower() == ".py":
                  try:
                      compile(text, str(path), "exec")
                  except SyntaxError as exc:
                      print(f"ERRO DE SINTAXE EM {path} (linha {exc.lineno}): {exc.msg}")
                      raise

          print("Todos os arquivos verificados e normalizados em UTF-8.")
          EOF

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do sistema com retry
        run: |
          set -e
          APT_OK=0
          for tentativa in 1 2 3; do
            echo "Tentativa $tentativa de apt-get update..."
            if sudo apt-get update -y; then
              APT_OK=1
              break
            fi
            sleep 5
          done
          test "$APT_OK" -eq 1

          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf automake autopoint gettext libtool libltdl-dev \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev patch clang lld

          python3 -m pip install --upgrade pip setuptools wheel "cython<3.0" "buildozer==1.5.0" "python-for-android==2024.01.21"

      - name: Compilar APK debug
        env:
          GRADLE_OPTS: "-Xmx2048m -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
        run: |
          rm -rf .buildozer/android/platform
          set +e
          buildozer android debug < /dev/null > buildozer_full.log 2>&1
          EXIT_CODE=$?
          set -e

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "=== ÚLTIMAS 100 LINHAS DO LOG ==="
            tail -n 100 buildozer_full.log
            echo "=== ERROS DO GRADLE / BUILD ==="
            grep -E "FAILURE:|Execution failed|Could not|Exception|ERROR:|Error:|failed|SyntaxError" buildozer_full.log | tail -n 50
            exit "$EXIT_CODE"
          fi

      - name: Enviar APK como Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: janus-call-apk
          path: bin/*.apk
          if-no-files-found: error
